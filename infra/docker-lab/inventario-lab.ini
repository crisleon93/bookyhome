# inventario-lab.ini — inventario para el laboratorio Docker
# El servidor "limpio" corre como contenedor en la red lab_net.

[bookyhome_lab]
bkh-servidor ansible_host=bkh-servidor ansible_user=ansible ansible_port=22

[bookyhome_lab:vars]
ansible_ssh_private_key_file=/root/.ssh/id_ed25519
ansible_ssh_common_args=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
ansible_python_interpreter=/usr/bin/python3

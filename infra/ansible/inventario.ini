# inventario.ini — BookyHome
# Inventario de ejemplo para el playbook de Ansible.
# Sin IPs reales: sustituir los valores de ansible_host antes de desplegar.
#
# Uso:
#   ansible-playbook -i infra/ansible/inventario.ini \
#                    infra/ansible/instalar-bookyhome.yml
#
# Comprobación de acceso (ping):
#   ansible -i infra/ansible/inventario.ini bookyhome_prod -m ping

[bookyhome_prod]
# servidor de producción (sustituir IP o hostname real)
bkh-prod-01 ansible_host=<IP_O_HOSTNAME_REAL> ansible_user=ana ansible_port=22

# Si usas Multipass para pruebas:
# bkh-lab ansible_host=<ip-de-multipass> ansible_user=ubuntu ansible_port=22

[bookyhome_prod:vars]
ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_python_interpreter=/usr/bin/python3

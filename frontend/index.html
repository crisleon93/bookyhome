<!doctype html>
<html lang="es" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link id="app-favicon" rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BooKyHome Colombia | Libros y librerías</title>
    <!-- Aplica el modo oscuro de forma síncrona antes de que React pinte,
         evitando el flash de contenido sin estilos (FOUC) -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('darkMode') === 'true') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

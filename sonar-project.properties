sonar.projectKey=BooKyHome1e2746b4393e43cf33f2bccb016aa253e92b5679
sonar.organization=bookyhome

# Nombre y version del proyecto
sonar.projectName=BookyHome
sonar.projectVersion=1.0

# Fuentes a analizar
sonar.sources=frontend/src,backend/app,app-movil/src

# Lenguajes
sonar.language=

# Codificacion
sonar.sourceEncoding=UTF-8

# Exclusiones: no analizar dependencias, builds, tests, configs ni assets
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/.expo-export/**,\
  **/coverage/**,\
  **/__pycache__/**,\
  **/*.pyc,\
  **/migrations/**,\
  **/uploads/**,\
  **/static/**,\
  frontend/src/assets/**,\
  app-movil/src/assets/**,\
  **/*.test.js,\
  **/*.test.jsx,\
  **/*.spec.js,\
  **/*.spec.jsx,\
  frontend/src/test/**

# Cobertura de tests (frontend con vitest)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Rutas de tests para no contarlos como codigo de produccion
sonar.tests=frontend/src/test,backend/tests
sonar.test.inclusions=**/*.test.jsx,**/*.test.js,**/test_*.py

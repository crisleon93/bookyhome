overrides:
  # Forzar versión segura de @xmldom/xmldom en todas las dependencias transitivas.
  # 0.9.12 corrige CVE-2026-83605, CVE-2026-83606, CVE-2026-83607, CVE-2026-83608, CVE-2026-83609 y CVE-2026-83612.
  # La rama 0.9.x es compatible con plist y @expo/plist.
  '@xmldom/xmldom': 0.9.12
  # Mantener node-forge en una versión con la corrección de ReDoS.
  node-forge: 1.4.3
  js-yaml@^3: 3.15.2
  js-yaml@^4: 4.3.2
  compression: 1.8.2
  decode-uri-component: 0.5.1
  'brace-expansion@<2': 1.1.21
  'glob@>=9.0.0': 14.0.6
  image-size: 2.1.0
  'minimatch@>=7.0.0': 11.0.1
  'plist@^3': 5.1.1
  'undici@^6': 6.29.1
  'uuid@^7': 14.0.0
  postcss: 8.5.32
  shell-quote: 1.11.0
# Mitigar CVE-2026-112366 hasta que picomatch publique versiones corregidas.
patchedDependencies:
  picomatch@2.3.2: ../patches/picomatch@2.3.2.patch
  picomatch@4.0.7: ../patches/picomatch@4.0.7.patch
  react-native-webview@17.1.0: patches/react-native-webview@17.1.0.patch

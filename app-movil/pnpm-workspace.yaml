  # Mantener node-forge en una versión con la corrección de ReDoS.
  node-forge: 1.4.3
  js-yaml@^3: 3.15.2
  js-yaml@^4: 4.3.2
  decode-uri-component: 0.5.1
  'brace-expansion@<2': 1.1.20
  image-size: 2.1.0
  'minimatch@>=7.0.0': 11.0.1
  postcss: 8.5.32
  shell-quote: 1.11.0
